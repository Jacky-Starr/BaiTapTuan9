name: Java CI, Coverage, Cache & PR Review

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  checkstyle-review:
    name: Checkstyle Code Review
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Cài đặt Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: 4. Chạy Checkstyle và Bot Review lên PR
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B checkstyle:checkstyle
          reviewdog -f=checkstyle -name="checkstyle" -reporter=github-pr-review -fail-on-error < target/checkstyle-result.xml

      - name: 5. Kiểm tra Checkstyle đạt chuẩn
        run: mvn -B checkstyle:check

  build-and-test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17 & Bật Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Chạy Maven Verify (Test, Package & JaCoCo Check)
        run: mvn -B clean verify

      - name: 4. Lưu trữ báo cáo JaCoCo Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/

      - name: 5. Lưu trữ file JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-utils-jar-${{ matrix.os }}
          path: target/*.jar
name: Java CI, Coverage, Cache & PR Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  checkstyle-review:
    name: Checkstyle Code Review
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Chạy Checkstyle xuất báo cáo XML
        run: mvn -B checkstyle:checkstyle

      - name: 4. Bot tự động bình luận lỗi lên Pull Request
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-checkstyle@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_path: target/checkstyle-result.xml
          reporter: github-pr-review
          fail_on_error: true

      - name: 5. Xác nhận Checkstyle đạt chuẩn
        run: mvn -B checkstyle:check

  build-and-test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17 & Bật Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Chạy Maven Verify (Test, Package & JaCoCo Check)
        run: mvn -B clean verify

      - name: 4. Lưu trữ báo cáo JaCoCo Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/

      - name: 5. Lưu trữ file JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-utils-jar-${{ matrix.os }}
          path: target/*.jar
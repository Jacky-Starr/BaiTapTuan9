name: Java CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Chạy Maven Test và Package
        run: mvn -B clean package

      - name: 4. Lưu trữ file JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-utils-jar-${{ matrix.os }}
          path: target/*.jar